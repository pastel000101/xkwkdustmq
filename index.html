<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 타자연습 — 발음과 뜻을 함께</title>
<!--
  외부 리소스를 일절 참조하지 않는다 (NFR-001).
  CDN·웹폰트·애널리틱스 없음. 인터넷 없이 동작한다.

  스크립트는 type="module" 을 쓰지 않는다.
  file:// 로 열었을 때 브라우저가 CORS 정책으로 모듈 로드를 차단하기 때문이다 (C-2).
-->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/practice.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="title-box">
      <h1>영어 타자연습</h1>
      <p class="tagline">타자를 치면서 발음과 뜻을 함께 익힙니다</p>
    </div>
    <button type="button" class="btn ghost" id="legend-btn" data-testid="legend-button">
      발음 기호 범례 <kbd>F9</kbd>
    </button>
  </header>

  <section class="control-bar">
    <div class="ctl-group">
      <span class="ctl-label">모드</span>
      <div class="seg" id="mode-select" data-testid="mode-select">
        <button type="button" class="seg-btn" data-value="word">단어</button>
        <button type="button" class="seg-btn" data-value="sentence">문장</button>
      </div>
    </div>

    <div class="ctl-group">
      <label class="ctl-label" for="level-select">난이도</label>
      <select id="level-select" data-testid="level-select"></select>
    </div>

    <div class="ctl-group">
      <label class="ctl-label" for="category-select">주제</label>
      <select id="category-select" data-testid="category-select"></select>
    </div>

    <div class="ctl-group">
      <label class="ctl-label" for="order-select">순서</label>
      <select id="order-select" data-testid="order-select"></select>
    </div>

    <div class="ctl-group toggles">
      <button type="button" class="toggle" id="pron-toggle" data-testid="pron-toggle"
              aria-pressed="false">
        <span class="toggle-name">발음</span>
        <span class="toggle-state">끔</span>
        <kbd>F2</kbd>
      </button>
      <button type="button" class="toggle" id="meaning-toggle" data-testid="meaning-toggle"
              aria-pressed="false">
        <span class="toggle-name">뜻</span>
        <span class="toggle-state">끔</span>
        <kbd>F4</kbd>
      </button>
    </div>
  </section>

  <!--
    안내 슬롯: 높이를 항상 확보한다.
    안내가 나타났다 사라질 때 아래 연습 영역이 밀리지 않도록.
  -->
  <div class="notice-slot">
    <div class="notice warn" id="ime-warning" data-testid="ime-warning" hidden>
      한글 입력 상태입니다. <kbd>한/영</kbd> 키를 눌러 영문 입력으로 바꿔 주세요.
    </div>
    <div class="notice" id="empty-notice" data-testid="empty-notice" hidden>
      선택한 조건에 맞는 콘텐츠가 없습니다. 난이도나 주제를 바꿔 보세요.
    </div>
    <div class="notice error" id="load-error" data-testid="load-error" hidden></div>
  </div>

  <main class="practice-area" id="practice-area" data-testid="practice-area">
    <div class="groups" id="groups" data-testid="pron-layer"></div>
    <div class="meaning-layer" id="meaning-layer" data-testid="meaning"></div>
  </main>

  <section class="result-panel" id="result-panel" data-testid="result-panel" hidden>
    <div class="result-stats">
      <div class="stat">
        <b id="result-wpm" data-testid="result-wpm">—</b>
        <span>WPM</span>
      </div>
      <div class="stat">
        <b id="result-accuracy" data-testid="result-accuracy">—</b>
        <span>정확도</span>
      </div>
      <div class="stat">
        <b id="result-time" data-testid="result-time">—</b>
        <span>소요 시간</span>
      </div>
      <div class="stat">
        <b id="result-errors" data-testid="result-errors">—</b>
        <span>오타</span>
      </div>
    </div>
    <div class="result-actions">
      <button type="button" class="btn" id="retry-button" data-testid="retry-button">
        다시하기 <kbd>Esc</kbd>
      </button>
      <button type="button" class="btn primary" id="next-button" data-testid="next-button">
        다음 문항 <kbd>Tab</kbd>
      </button>
    </div>
  </section>

  <footer class="shortcut-guide" id="shortcut-guide" data-testid="shortcut-guide"></footer>

</div>

<div class="modal-backdrop" id="legend-modal" data-testid="legend-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="legend-title">
    <div class="modal-head">
      <h2 id="legend-title">발음 기호 범례</h2>
      <button type="button" class="btn ghost" id="legend-close">닫기 <kbd>Esc</kbd></button>
    </div>
    <div class="modal-body" id="legend-body"></div>
    <p class="modal-foot">
      한글 표기는 영어 발음의 <b>근사치</b>입니다. 위 기호들은 한글로는 구분되지 않는 소리를
      알려주기 위한 것입니다.
    </p>
  </div>
</div>

<!-- ===== 데이터 (Unit 1) ===== -->
<script src="data/phoneme-guide.js"></script>
<script src="data/words.js"></script>
<script src="data/sentences.js"></script>

<!-- ===== 상태 ===== -->
<script src="js/app-state.js"></script>

<!-- ===== 도메인 ===== -->
<script src="js/content-store.js"></script>
<script src="js/typing-engine.js"></script>
<script src="js/stats-tracker.js"></script>

<!-- ===== 뷰 ===== -->
<script src="js/practice-layout.js"></script>
<script src="js/text-renderer.js"></script>
<script src="js/annotation-renderer.js"></script>
<script src="js/result-view.js"></script>
<script src="js/control-panel.js"></script>
<script src="js/legend-view.js"></script>

<!-- ===== 입력 ===== -->
<script src="js/input-handler.js"></script>

<!-- ===== 서비스 (bootstrap 이 마지막) ===== -->
<script src="js/settings-service.js"></script>
<script src="js/practice-session-service.js"></script>
<script src="js/bootstrap-service.js"></script>

<script>
  App.BootstrapService.start();
</script>

</body>
</html>
